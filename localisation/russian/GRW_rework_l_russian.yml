 GRW_rework.15.t:0 "Прогулка"
 GRW_rework.15.d:0 "Вечернее солнце окрашивало крыши Кивессина в медный цвет. Филипп и Рейн шли по узкой мощёной улице, мимо ещё не залатанных фасадов и свежевысаженных деревьев. Город дышал — тяжело, натужно, но дышал. Где-то впереди смеялись дети, а из окна второго этажа доносился запах свежей выпечки.\n\nРейн шёл молча, заложив копыта за спину, изредка поглядывая на витрины лавок. Филипп вдруг остановился. Его взгляд упёрся в стену дома напротив — старый королевский герб, криво замазанный краской, всё ещё проступал сквозь слой побелки.\n\n— Знаешь, о чём я думаю, Рейн? — голос Филиппа звучал тихо, но в нём дрожала какая-то неуёмная сила. — Мы починили крыши. Мы накормили голодных. Мы дали нашим грифонам школы и больницы. Но этого... этого мало.\n\nРейн повернулся к нему, чуть склонив голову.\n\n— Мало?\n\n— Мало! — Филипп сжал кулак так, что когти побелели. Его глаза горели тем самым огнём, который Рейн видел в них на баррикадах Прайвена. — Посмотри дальше наших границ, Рейн. Посмотри на восток, на юг, на запад. Везде — одно и то же. Грифоны гнут спины под хлыстами баронов и королей. В Грифенхейме рабочие спят на фабричных полах. В Ангрии крестьяне отдают половину урожая лорду, который даже не знает их имён. А мы... мы сидим тут и радуемся, что починили пару крыш?\n\nОн резко повернулся к Рейну, и в его голосе зазвенела боль.\n\n— Я не могу спать спокойно, Рейн. Не могу. Каждую ночь я думаю о них. О грифонах, которые прямо сейчас, в эту самую секунду, голодают, страдают, умирают — только потому, что родились не в том месте. Мы построили Прайвен для всех. Но «все» — это не только те, кто живёт внутри наших границ.\n\nРейн остановился. Он долго смотрел на Филиппа — на усталые морщины вокруг его глаз, на седые перья на висках, на руки, которые дрожали не от слабости, а от ярости.\n\n— Ты говоришь об экспорте революции, — тихо произнёс Рейн.\n\n— Я говорю о справедливости! — Филипп почти выкрикнул это, и какая-то старушка на углу испуганно обернулась. Он осёкся, провёл когтем по лицу и заговорил тише, но от этого его слова стали только тяжелее. — Я не хочу войн ради войн, Рейн. Я хочу протянуть руку. Создать что-то большее. Союз. Фронт. Назови как хочешь. Место, куда любой грифон — из любого угла этого проклятого континента — сможет обратиться и сказать: «Я хочу быть свободным». И мы ответим: «Мы с тобой».\n\nТишина повисла между ними. Рейн смотрел на город — на детей, играющих в мяч у фонтана, на рабочего, красящего ставни в яркий синий цвет, на старика, читающего газету на лавке. Всё это стало возможным потому, что кто-то когда-то решил бороться.\n\n— Освободительный фронт Грифонии, — медленно произнёс Рейн, словно пробуя слова на вкус.\n\nФилипп посмотрел на него. В его глазах блеснула надежда — хрупкая, отчаянная, настоящая.\n\n— Да. Именно так.\n\nРейн кивнул. Один раз. Твёрдо.\n\n— Тогда начинаем."
