 GRW_rework.18.t:0 "Доклад Товарища Эпплторн"
 GRW_rework.18.d:0 "В просторном кабинете Главнокомандующего Филиппа Редглада стояла тишина, прерываемая лишь шелестом бумаг. Перед столом стояла фельдмаршал товарищ Эпплторн, вытянувшись по стойке смирно. На её суровом лице читалась абсолютная уверенность.\n\n— Товарищ Главнокомандующий, — начала она четким, поставленным голосом. — Армия Прайвена завершила перегруппировку и полностью готова к полномасштабным боевым действиям. Если мы примем решение о военном вторжении для объединения региона, наши войска не подведут.\n\nОна развернула карту Эви на столе, указывая копытом на северные границы.\n\n— В случае конфликта, нашей первой стратегической целью должна стать [LUS.GetNameDef]. Их граница наиболее уязвима, что даст нам возможность для резкой атаки с севера прямо в [GRY.GetNameDef]. Если мы ударим быстро и решительно, мы сомнем их оборону прежде, чем они успеют мобилизовать резервы.\n\nФилипп внимательно выслушал доклад, задумчиво глядя на карту. Он медленно провел когтем по нарисованным линиям фронта.\n\n— Спасибо за доклад, товарищ Эпплторн, — произнес Филипп после недолгой паузы. — Вы проделали отличную работу. Конечно, желательно решить вопрос объединения мирным путем. Мы не хотим проливать кровь рабочих и крестьян без необходимости. Но... — его взгляд стал жестким. — Революция без крови не строится. Если они откажутся сложить оружие, мы принесем им свободу на штыках. Подготовьте войска к плану «Свет Эви»."
 GRW_rework.18.a:0 "Весь регион должен быть свободным!"
 GRW_light_of_ewi_idea:0 "Военный план «Свет Эви»"
 GRW_light_of_ewi_idea_desc:0 "Наши войска готовы к молниеносному удару на севере. План разработан с учетом всех уязвимостей противника."

 GRW_rework.19.t:0 "Ультиматум от [FROM.GetNameDef]"
 GRW_rework.19.d:0 "Главнокомандующий [FROM.GetLeader] направил нашему правительству официальное предложение, которое больше похоже на неприкрытый ультиматум. [FROM.GetNameDef] утверждает, что регион Эви должен быть един, а их форма правления — это единственный правильный путь для наших народов.\n\nНам предлагают мирно интегрироваться в их государство, распустить нашу армию и полностью подчиниться их правительству. В случае отказа они откровенно угрожают применением подавляющей военной силы.\n\nМы не можем игнорировать их армию, скапливающуюся на наших границах. Каков будет наш ответ?"
 GRW_rework.19.a:0 "Сдаться и принять условия."
 GRW_rework.19.b:0 "Отказать!"
 GRW_rework.20.t:0 "[FROM.GetNameDef] капитулирует!"
 GRW_rework.20.d:0 "Правительство страны [FROM.GetNameDef], осознав всю мощь нашей армии и неотвратимость грядущих перемен, решило принять наше предложение об интеграции.\n\nИх вооруженные силы будут распущены, а государственные структуры перейдут под наш полный контроль. Революция без крови — это тоже великая победа, товарищи!"
 GRW_rework.20.a:0 "Отличные новости!"
 GRW_rework.21.t:0 "[FROM.GetNameDef] отказывается!"
 GRW_rework.21.d:0 "Правительство страны [FROM.GetNameDef] категорически отвергло наше предложение. В своем официальном ответе они заявляют, что будут защищать свою независимость до последней капли крови.\n\nЧто ж, фельдмаршал товарищ Эпплторн была абсолютно права: революция без крови не строится. Пора пустить в ход план «Свет Эви» и забрать эти территории силой."
 GRW_rework.21.a:0 "Всем войскам — приказ к наступлению!"

