 GRW_rework_endtree1_tt:0 "§YПосле отстройки социализма мы готовы к экспорту революции§!\nЭто §Yзагрузит новые фокусы§!"
 GRW_rework.17.t:0 "Объявление"
 GRW_rework.17.d:0 "Центральная площадь Кивессина была заполнена до отказа. Тысячи рабочих, крестьян и солдат стояли плечом к плечу, ожидая выступления. Над морем голов развевались красные знамена, а воздух дрожал от наэлектризованного ожидания.\n\nФилипп медленно подошел к трибуне. Окинув взглядом бескрайнюю толпу, он сделал глубокий вдох. Когда он заговорил, его голос, усиленный репродукторами, разнесся над всем городом:\n\n— Товарищи! Граждане Прайвена! Сегодня мы стоим здесь не просто как выжившие, а как творцы нового мира! Мы преодолели немыслимые трудности. Мы прошли через голод, разруху и гражданскую войну. Мы отстроили нашу экономику, укрепили нашу армию и доказали всем, что социализм — это не просто мечта, это реальность, которую мы создаем собственными когтями и копытами!\n\nТолпа взорвалась овациями, но Филипп поднял руку, призывая к тишине.\n\n— Но мы не остановимся на достигнутом! — его голос зазвенел с новой силой. — Революция не может существовать в изоляции. За нашими границами миллионы угнетенных грифонов всё еще стонут под гнетом капиталистов, феодалов и тиранов. Наша глобальная цель — освободить их всех!\n\nОн сделал паузу, обводя взглядом затаивших дыхание слушателей.\n\n— И мы начнем наш путь освобождения с тех земель, которые исторически были частью великого Эви. Мы вернем эти территории народу и зажжем пламя революции по всему континенту! Смерть тиранам! Свободу пролетариату!\n\nПлощадь содрогнулась от ликующего рева, слившегося в единый мощный порыв. Машина революции была запущена, и теперь её было не остановить."
 GRW_rework.17.a:0 "Лишь начало..."
