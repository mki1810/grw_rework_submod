 GRW_rework.14.t:0 "Обсуждение первоначальных целей"



 GRW_rework.14.d:0 "В скромном кабинете главнокомандующего стоял густой запах дешевого табака. Рейн Твистер тихо прикрыл за собой дверь и остановился у порога. За рабочим столом, заваленным отчетами и сводками, сидел Филипп Редглад. Он тер переносицу, опустив уставший взгляд на какую-то мятую бумагу. За окном лил монотонный осенний дождь, смывая с улиц Прайвена копоть недавних боев.\n\n— Ты просил зайти, Филипп? — тихо спросил Рейн, нарушая тишину.\n\nРедглад медленно поднял голову. Под его глазами залегли глубокие тени. Гражданская война забрала у них слишком многое, и победа, доставшаяся такой ценой, на вкус была с привкусом пепла.\n\n— Да, Рейн... присаживайся, — Филипп устало махнул когтем в сторону свободного стула. — Знаешь, я только что читал отчеты из восточных провинций. Там начинается голод. А в госпиталях закончились антибиотики.\n\nРейн тяжело вздохнул, опускаясь на жесткий деревянный стул. Он и сам видел эти сводки.\n\n— Мы отдали всё, чтобы сбросить старый режим. Всю экономику, все запасы... мы победили, Филипп. Но страна в руинах.\n\n— Вот именно, — Филипп сжал кулаки, и в его голосе дрогнула тщательно скрываемая боль. — Мы обещали им свободу, Рейн. Обещали равенство. А сейчас матерям нечем кормить своих птенцов. Какой смысл в наших высоких идеалах, если народ умирает от обычных болезней?\n\nТвистер молчал. Он был командиром, он знал, как выигрывать битвы, но как выигрывать мир — это было в новинку для них обоих.\n\n— Наши первоначальные цели должны измениться, — продолжил Филипп, немного успокаиваясь. — Революция — это не только винтовки и баррикады. Это хлеб на столе. Это крыша над головой и доступные лекарства. Мы должны всё бросить на социальное обеспечение. Забыть про громкие лозунги и просто накормить наших сограждан. Обеспечить их всем, что нужно для нормальной жизни.\n\nРейн посмотрел в глаза своему старому товарищу. Там не было безумного блеска вождя — только глубокая, выстраданная забота о каждом жителе республики.\n\n— Я согласен, — твердо ответил Рейн. — Мы должны оправдать их доверие. Мы не дадим им умереть, после того как они выжили в этой мясорубке.\n\nФилипп слабо улыбнулся и кивнул. Впереди был долгий путь, но впервые за долгое время он чувствовал, что они делают правильный шаг."



