 GRW_rework.16.t:0 "Путь освобождения"
 GRW_rework.16.d:0 "Кабинет товарища Филиппа был наполнен сигаретным дымом и запахом крепкого, давно остывшего кофе. На столе, заваленном отчетами и сводками, была расстелена большая карта Грифонии. Рейн и Филипп склонились над ней, продолжая обсуждение, начатое еще во время их прошлой совместной прогулки.\n\n— Мы укрепили наши позиции внутри страны, товарищ Филипп, — заговорил Рейн, прерывая затянувшуюся тишину. — Но революция не может оставаться запертой в этих границах. Идеи освобождения должны идти дальше, иначе нас рано или поздно задавят числом.\n\nФилипп медленно кивнул, не отрывая взгляда от карты.\n— Согласен. Вопрос лишь в том, куда нанести первый удар. Континент огромен, и у нас полно врагов. Нам нужна цель, которая не только стратегически важна, но и идеологически оправдана.\n\nРейн уверенно поставил копыто на юго-восточную часть континента, очерчивая знакомые изломанные линии границ.\n\n— Путь освобождения нужно с чего-то начать, — произнес он. — Раньше все вы были одним государством — великим Эви. Это не просто куски земли, это общая история, которую искусственно разорвали на части феодалы и реакционеры. Если наша цель — объединить континент и принести революцию, начинать следует именно с тех стран, которые раньше входили в его состав.\n\nФилипп посмотрел на карту, затем на Рейна. В его глазах блеснуло понимание.\n\n— Восстановление Эви, но уже как социалистической республики... — задумчиво протянул Филипп, стряхивая пепел в пепельницу. — Ты абсолютно прав, Рейн. Это сильный политический шаг. Это символ, который поймут все рабочие и крестьяне в тех регионах. Возрождение старого величия, но под новыми, справедливыми знаменами пролетариата.\n\nФилипп решительно поднялся с кресла и подошел к окну. На площади внизу уже собирались отряды свежесформированной Красной Армии.\n\n— Раз план намечен, нам нужно подготовиться к выступлению перед народом, — произнес он, обернувшись. — Мы должны зажечь в их сердцах огонь борьбы. Вскоре мы объявим о начале освободительного похода!"
