l_russian:



 GRW_famine_category:0 "Борьба с голодом"



 GRW_famine_category_desc:0 "Над нашей страной нависла угроза ужасного голода. Мы должны предпринимать экстренные меры, чтобы оттянуть неизбежное, пока реформа сельского хозяйства не будет завершена."



 GRW_delay_famine:0 "Распределить экстренные пайки"



 GRW_delay_famine_desc:0 "Мы можем использовать наши неприкосновенные запасы, чтобы накормить население и отложить начало голода на месяц."



 GRW_rework_tree:0 "Новый путь Прайвена"



 GRW_rework_start:0 "Начало реформ"



 GRW_rework_start_desc:0 "Пора изменить курс нашей партии и страны."



 GRW_tackle_famine:0 "Аграрный вопрос"



 GRW_tackle_famine_desc:0 "Мы должны окончательно решить проблему голода в нашей стране."



 GRW_rework_focus_1:0 "Скорая победа!"



 GRW_rework_focus_1_desc:0 "Гражданская война требует от нас решительных действий. Победа близка!"



 GRW_rework.2.t:0 "Скорая победа!"



 GRW_rework.2.d:0 "Утренний туман медленно рассеивался над полями сражений, обнажая изрытую воронками землю. В полевой палатке командования царило необычайное оживление. Офицеры-грифоны сгрудились вокруг радиостанции, жадно ловя каждое слово, пробивающееся сквозь треск помех. Наконец, радист сорвал наушники и повернулся к командующим, его клюв был приоткрыт в восторженной улыбке.\n\n— Товарищи! Вражеский фронт прорван сразу на трех направлениях! Реакционеры бегут в панике, бросая технику и припасы.\n\nЭта новость мгновенно разлетелась по всему лагерю. Солдаты, еще вчера измотанные и потерявшие всякую надежду, теперь обнимались и вскидывали винтовки в воздух. После месяцев кровавой мясорубки гражданской войны горизонт наконец прояснился. Этот стремительный рывок, рожденный отчаянием и железной волей революционеров, стал той самой каплей, которая переполнила чашу весов истории. До окончательной победы оставался всего один уверенный шаг."



 GRW_rework.2.a:0 "Вперед, товарищи!"



 GRW_rework_potato:0 "Второй хлеб"



 GRW_rework_potato_desc:0 "Мы не можем допустить, чтобы голод уничтожил революцию раньше, чем наши враги. Картофель растет там, где погибает пшеница, и даёт урожай даже на выжженной войне земле. Объявляя его «вторым хлебом», мы принимаем экстренные меры: каждый посаженный клубень - это шаг к предотвращению продовольственной катастрофы и спасению тысяч жизней."



 GRW_rework_milita:0 "Оружие в руки!"



 GRW_rework_milita_desc:0 "Революция в опасности, и у нас нет времени на долгую подготовку регулярных частей. Мы должны открыть склады, раздать винтовки рабочим и крестьянам и сформировать отряды народного ополчения. Каждый грифон, способный держать оружие, встанет на защиту Прайвена."



 GRW_rework.3.t:0 "Оружие в руки!"



 GRW_rework.3.d:0 "Скрип тяжелых металлических ворот эхом разнесся по пустым улицам города. Когда массивные двери арсенала распахнулись, перед ними уже стояла огромная толпа. Рабочие в замасленных комбинезонах, крестьяне в поношенной одежде, студенты и даже старики — все они пришли сюда по первому зову партии. Революция стояла на краю гибели, и времени на формирование регулярных частей больше не оставалось.\n\nКомиссар, стоя на ящике из-под патронов, смотрел на это море суровых лиц. Он не видел в них страха, только мрачную готовность защищать свои дома до последней капли крови.\n\n— Товарищи! — его голос перекрыл гул толпы. — Враг уже у ворот. У нас нет униформы. У нас нет времени на тренировки. Но у нас есть винтовки, и у нас есть наша свобода!\n\nОдин за другим, молча и сосредоточенно, грифоны подходили к дверям складов. Им выдавали пропахшие солидолом старые винтовки, мешочки с патронами и короткие наставления. Эти наспех сколоченные отряды народного ополчения были последней надеждой революции — живым щитом, готовым встать на пути любой угрозы."



 GRW_rework.3.a:0 "Они готовы к бою!"



 GRW_rework_partisan:0 "Скоординировать партизан"



 GRW_rework_partisan_desc:0 "Множество разрозненных партизанских отрядов действуют в тылу врага без единого плана и связи. Создание централизованного штаба сопротивления позволит превратить стихийные набеги в сокрушительные удары по снабжению противника."



 GRW_rework.4.t:0 "Скоординировать партизан"



 GRW_rework.4.d:0 "Глухой ночью в лесной чаще, вдали от чужих глаз, состоялось тайное собрание. У костра, нервно озираясь по сторонам, сидели полевые командиры партизанских отрядов. До сих пор они действовали вслепую: стихийные набеги на обозы, подорванные мосты и ночные засады наносили врагу урон, но этого было недостаточно для перелома в войне. Без связи и единого командования их люди гибли попусту.\n\nПредставитель центрального штаба, закутанный в плотный плащ, развернул перед ними карту вражеских тылов.\n\n— Ваша храбрость неоспорима, товарищи, — начал он, указывая когтем на ключевые транспортные артерии реакционеров. — Но храбрость без дисциплины — это просто самоубийство. С этого момента все ваши действия будут координироваться. Мы создаем единую сеть сопротивления. Больше никаких случайных стычек. Мы будем бить туда, где врагу больнее всего: по их путям снабжения, складам с топливом и командным пунктам.\n\nКомандиры слушали, молча кивая. Разрозненные искры сопротивления наконец сливались в единый, всепоглощающий пожар, готовый выжечь вражеские тылы."



 GRW_rework.4.a:0 "Поднять на восстание Рисовые поля!"



 GRW_rework.4.b:0 "Поднять на восстание горы Кив!"



 GRW_rework.4.c:0 "Поднять на восстание порт Сидия!"



 GRW_rework_newequip:0 "Оружие нового тысячелетия"



 GRW_rework_newequip_desc:0 "Старые винтовки и артиллерия времен прошлых войн не смогут обеспечить победу. Нашим борцам нужно современное, надёжное и массовое вооружение. Запустив производство новых образцов оружия, мы дадим ополченцам и партизанам силу, способную переломить ход войны."



 GRW_rework_helpbat:0 "Сельхоз батальоны"



 GRW_rework_helpbat_desc:0 "Солдаты умеют держаться не только за винтовку, но и за плуг. Формирование специальных сельскохозяйственных батальонов из солдат и резервистов позволит направить дисциплинированную силу армии на посевные работы, восстановление заброшенных ферм и спасение Прайвена от угрозы голода."



 GRW_rework_artely:0 "Крестьянские артели"



 GRW_rework_artely_desc:0 "Военное вмешательство лишь создаст хаос в деревне. Вместо привлечения солдат мы должны стимулировать самих крестьян объединяться в добровольные артели. Предоставив им льготы, технику и свободу распределения урожая, мы обеспечим эффективный труд без жесткого государственного принуждения."



 GRW_peasant_artels_idea:0 "Крестьянские артели"



 GRW_rework_lastargument:0 "Последний довод"



 GRW_rework_lastargument_desc:0 "Враг уже шатается, и мы не дадим ему времени перевести дух. Собрав в единый кулак все оставшиеся силы, армия Прайвена готова нанести решающий, окончательный удар. Это наш последний довод - наступление, которое сломает хребет противнику и поставит жирную точку в этой войне."



 GRW_rework.5.t:0 "Последний довод"



 GRW_rework.5.d:0 "Тусклый свет единственной уцелевшей керосиновой лампы выхватывал из полумрака изможденные лица собравшихся. В наспех переоборудованном под штаб подвале старой ратуши пахло сыростью, дешевым табаком и пролитым кофе. На массивном дубовом столе, испещренном царапинами, была расстелена потертая карта Прайвена, усыпанная десятками деревянных фишек, обозначавших позиции как революционных сил, так и реакционеров.\n\nФилипп Редглад, бессменный лидер освободительного движения, тяжело опирался когтями о край стола. Его перья потускнели от въевшейся пыли и пороховой гари, а под глазами залегли глубокие тени — свидетельство многих бессонных ночей. Он оторвал взгляд от карты и обвел им своих лучших командиров. — Враг уже шатается, товарищи, — его голос был тихим, но хриплым от усталости, словно наждачная бумага. — Мы не дадим им времени перевести дух. Если мы соберем в единый бронированный кулак все оставшиеся силы, мы сможем нанести решающий, окончательный удар.\n\nГенерал армии Тереза, чья военная форма была покрыта пятнами засохшей грязи, слегка расправила уставшие крылья и склонилась над столом. Она сдвинула несколько красных фишек вперед, прямо в центр вражеских построений. — Мои батальоны готовы к наступлению, товарищ Редглад. Мы провели перегруппировку и вооружили всех, кого смогли, вплоть до последнего ополченца, — она указала когтем на уязвимый фланг противника. — Если мы ударим здесь, мы прорвем их оборону в первые же сутки. Я лично поведу авангард, если потребуется.\n\nНа противоположном конце стола стоял генерал армии Рейн Твистер. Будучи пони в краю грифонов, он давно привык к косым взглядам, но сейчас это не имело значения. Рейн задумчиво потер подбородок копытом, его взгляд был прикован к линиям снабжения на карте. — Но у нас критически мало времени, — медленно произнес он, тщательно подбирая слова. — Наши бойцы истощены непрерывными боями, а припасы на исходе. Нам буквально нечем кормить резервы. Если наступление захлебнется, если мы увязнем в позиционной мясорубке — у нас просто не будет второго шанса. Нас сомнут.\n\nПовисла тяжелая тишина. Где-то наверху, за толстыми стенами подвала, глухо ухнул артиллерийский снаряд, с потолка посыпалась мелкая штукатурка.\n\n— Именно поэтому оно не должно захлебнуться, Рейн, — Филипп решительно ударил кулаком по столу, заставив фишки подпрыгнуть. — Это наш последний довод. Наступление, которое раз и навсегда сломает хребет противнику и поставит жирную кровавую точку в этой братоубийственной войне. Либо мы победим сейчас, либо все жертвы, весь этот пройденный ад был напрасен.\n\nТереза и Рейн переглянулись. В полумраке блиндажа между ними, грифоном и пони, промелькнуло молчаливое, но абсолютное взаимопонимание. Оба офицера синхронно выпрямились и отдали честь. В их глазах не было ни страха, ни сомнений — лишь непоколебимая, холодная решимость довести дело до конца. Приказ был отдан. Последний, безжалостный механизм революции запустился на полную мощность."



 GRW_rework.5.a:0 "Вперед, к победе!"



 GRW_last_argument_idea:0 "Последний довод"



 GRW_peasant_artels_idea_desc:0 "Вместо насильственного изъятия урожая мы поощряем создание добровольных крестьянских артелей. Свобода распределения излишков и государственная поддержка техники мотивируют фермеров работать усерднее, обеспечивая молодую республику жизненно необходимым продовольствием."



 GRW_last_argument_idea_desc:0 "Все наши резервы стянуты к линии фронта. Солдаты понимают, что отступление смерти подобно. Эта масштабная и решительная атака — наш последний довод в затянувшейся гражданской войне, который раз и навсегда решит судьбу Освободительной Армии и всей революции."



 GRW_civil_war_won_t:0 "Гражданская война окончена"



 GRW_civil_war_won_d:0 "Пепел оседал на брусчатку Кивессина, смешиваясь с кровью тех, кто отдал жизнь за свободу. Сегодня над древней столицей больше не развеваются знамена реакционеров и монархистов. С высокой трибуны, на фоне истерзанного войной, но не сломленного города, генерал Филипп Редглад обратился к измученному народу Прайвена.\n\n«Тирания пала! — его голос, усиленный репродукторами, разносился над ликующей толпой. — Но наша истинная война только начинается. Война с разрухой, голодом и призраками прошлого».\n\nОглядывая руины некогда процветающего королевства, каждый понимал: впереди годы изнурительного труда и лишений. Фабрики остановлены, поля выжжены, а казна пуста. Но в глазах грифонов больше не было страха. В их сердцах горело пламя Революции. На пепелище старого мира родилась новая надежда."



 prywhen.1.a:0 "Из пепла старого мира мы выкуем наше будущее!"



 GRW_communism_path_unlock_tt:0 "Открывает ветку фокусов для строительства §RКоммунизма§!"



 GRW_rework_complete_chaos:0 "Полный хаос"



 GRW_rework_complete_chaos_desc:0 "Гражданская война оставила страну в руинах. Экономика разрушена, промышленность в упадке, а общество истощено годами кровопролитных сражений. Восстановление займет годы, если не десятилетия."



 GRW_rework_victory_of_the_people:0 "Победа народа!"



 GRW_rework_victory_of_the_people_desc:0 "Победа далась нам тяжелой ценой. Теперь, когда война позади, мы должны сплотиться для строительства нового общества."



 GRW_rework.6.t:0 "Победа народа!"



 GRW_rework.6.d:0 "«...И сегодня, в этот великий день, мы с гордостью объявляем: силы монархистов окончательно капитулировали! Война окончена, товарищи!» — голос диктора раздавался из каждого радиоприемника, эхом разносясь по разрушенным улицам городов и тихим фермам. Грифоны собирались вокруг репродукторов, не веря своим ушам. Долгие годы страданий, голода и кровопролития наконец-то остались позади.\\n\\nЭто не просто победа в войне, это новая веха в истории нашей страны. На руинах королевства Бродфельд отныне возвышается Республика Прайвен! Впереди нас ждет тяжелый труд: восстановление экономики, постройка заводов и школ, создание нового, справедливого коммунистического общества. Но сегодня мы можем позволить себе хотя бы один день передышки. Сегодня мы празднуем."



 GRW_rework.6.a:0 "Это лишь начало."



 GRW_republic_cosmetic_communism:0 "Республика Прайвен"



 GRW_republic_cosmetic_communism_DEF:0 "Республика Прайвен"



 GRW_rework_new_republic:0 "Новая Республика"



 GRW_rework_new_republic_desc:0 "После тяжелой войны мы провозгласили новую республику. Наш народ сплочен как никогда, и никто не сможет сбить нас с пути социализма."



 GRW_rework.7.t:0 "Первый съезд партии"



 GRW_rework.7.d:0 "В душном, но торжественно украшенном зале собрались делегаты со всех уголков нашей страны. На трибуну под бурные аплодисменты поднялся товарищ Филипп. Он поздравил всех присутствующих с окончательной победой в гражданской войне и основанием нового, свободного государства. \n\nВ своей пламенной речи он объявил об историческом решении — создании Центрального Комитета Прайвенской Коммунистической Партии (ЦК ПКП), который возьмет на себя руководство страной в этот сложный переходный период. \n\n— Но на этом наше дело не заканчивается, — твердо заявил Филипп, обводя взглядом притихший зал. — Наша цель — не просто восстановить страну. Наша цель — построить истинную утопию для грифонов и освободить весь континент от гнета буржуазии! За работу, товарищи!\n\nСъезд встретил эти слова овациями."



 GRW_rework.7.a:0 "За дело революции!"



 GRW_rework_no_regular_army:0 "Отсутствие регулярной армии"



 GRW_rework_no_regular_army_desc:0 "После гражданской войны от некогда могучей королевской армии не осталось и следа. Наспех сколоченные отряды ополченцев, партизаны и дезертиры — вот из кого состоят наши вооруженные силы. У нас нет единого командования, четкой доктрины и дисциплины, а организация хромает на обе ноги. Потребуется много сил и времени, чтобы превратить это разношерстное ополчение в настоящую регулярную армию."



 GRW_rework_central_committee:0 "Центральный Комитет"



 GRW_rework_central_committee_desc:0 "ЦК ПКП был основан на первом партийном съезде для руководства страной. Его железная воля и четкий план действий укрепляют стабильность и веру народа в революцию."



 GRW_rework.8.t:0 "Заслуги перед революцией"



 GRW_rework.8.d:0 "В мрачном, прокуренном кабинете, где на стенах все еще виднелись следы от пуль времен недавних боев, товарищ Филипп склонился над стопками рапортов. Дверь со скрипом отворилась, и в помещение вошли двое: Тереза, чья униформа была покрыта пылью бесконечных маршей, и Рейн Твистер, чье лицо сохраняло ледяное спокойствие, столь характерное для него в моменты кризиса.\n\nФилипп тяжело поднялся из-за стола.\n\n— Товарищи, — начал он, и в его голосе звучала непреклонная сталь. — Война выиграна, но революция только начинается. Мы стоим на руинах старого мира, и теперь наша задача — построить на них новый порядок. Ваши заслуги на полях сражений неоценимы. Вы доказали свою преданность делу партии кровью и потом.\n\nОн подошел к Терезе и протянул ей тяжелую папку с гербом новой республики.\n\n— Тереза. Ваша тактическая выучка и холодный прагматизм спасли тысячи жизней. Но теперь нам нужны ваши таланты не в окопах, а в министерствах. Сим указом ЦК вы освобождаетесь от командования полевыми армиями и назначаетесь Министром Революции. Вся логистика, реорганизация промышленности и железная дисциплина в тылу отныне на ваших плечах. Никаких оправданий, только результат.\n\nЗатем Филипп повернулся к Рейну.\n\n— Рейн. Народ знает вас как своего заступника. Вы были щитом для слабых, когда армия короля пыталась растоптать их. Партия нуждается в таком символе. Вы получаете звание Фельдмаршала и должность Народного Комиссара. Ваша задача — реформировать наши вооруженные силы, выжечь остатки контрреволюции и гарантировать, что ни один враг больше не ступит на нашу землю.\n\nГрифоны переглянулись. Никаких торжественных парадов и звона медалей — лишь новые, еще более тяжелые обязанности. Но в их глазах горел огонь непреклонной решимости. Машина нового государства начала свой ход, и они стали ее главными шестернями."



 GRW_rework.8.a:0 "Служим народу!"



 GRW_rework_Theresa_advisor:0 "Тереза"



 GRW_rework_Theresa_advisor_desc:0 "Назначена Министром Революции."



 GRW_rework_iron_pragmatist:0 "Железный прагматик"



 GRW_rework_rain_twister_advisor:0 "Рейн Твистер"



 GRW_rework_rain_twister_advisor_desc:0 "Назначен Наркомом."



 GRW_rework_peoples_intercessor:0 "Народный заступник"



 GRW_rework_agrarian_reform_idea:0 "Аграрная реформа"



 GRW_rework_agrarian_reform_idea_desc:0 "Государство предоставляет крестьянам землю в бесплатную аренду, требуя выполнения плана. Все излишки остаются в распоряжении грифонов. Это значительно повысило производительность и лояльность."



 GRW_rework_famine_beaten_tt:0 "§GПобеждает риск голода§!"



 GRW_rework.9.t:0 "Аграрная реформа"



 GRW_rework.9.d:0 "В зале заседаний царила оживленная атмосфера. Товарищ Филипп, собрав вокруг себя делегатов от крестьянства и партийных экономистов, вынес на обсуждение судьбу сельского хозяйства. Было предложено множество вариантов: от полной коллективизации до сохранения мелких частных хозяйств. \n\nПосле долгих споров о том, как избежать падения урожаев и массового голода, Филипп выдвинул неожиданную, но гениальную идею — аграрную реформу. Государство предоставит крестьянам землю в безвозмездную аренду и установит четкий план сдачи урожая государству. Однако всё, что крестьянин вырастит сверх этого плана, останется в его полном распоряжении! \n\nЭта гибкая система стала настоящим спасением, даровав грифонам свободу распоряжаться результатами своего труда и небывалый стимул к работе."



 GRW_rework.9.a:0 "Гениальное решение!"



 GRW_rework_libarmygrif:0 "Народно-Освободительная Армия Грифонии"



 GRW_rework_libarmygrif_desc:0 "Основа любого государства — это его армия. Мы не можем вечно полагаться на неорганизованные отряды ополченцев. Нам необходимо создать настоящую Народно-Освободительную Армию Грифонии."



 GRW_rework_reform_army_tt:0 "§GМы начнем реформировать армию§!"



 GRW_rework_prywhen_army:0 "Армия Прайвена"
 GRW_rework_prywhen_army_desc:0 "Хотя наша армия всё еще далека от идеала, мы начали процесс её реорганизации и стандартизации. Шаг за шагом мы превратим её в грозную силу."
 GRW_rework.10.t:0 "Доклад о состоянии вооруженных сил"
 GRW_rework.10.d:0 "В зале заседаний повисла тишина, когда новоиспеченный Народный Комиссар Рейн Твистер разложил на столе стопку бумаг. Его лицо оставалось бесстрастным, но цифры в отчетах говорили сами за себя.\n\n— Товарищи, — начал он, чеканя каждое слово. — Я закончил инспекцию наших так называемых вооруженных сил. Буду краток: регулярной армии у нас нет. То, что мы имеем — это разрозненные отряды партизан, вооруженные трофейными винтовками ополченцы и бывшие дезертиры королевской армии. У них нет единого командования, нет стандартизированного калибра, а понятие субординации для многих из них ограничивается уважением к полевому командиру.\n\nФилипп нахмурился, сцепив когти в замок.\n\n— Мы выиграли войну с этой армией, Рейн.\n\n— Мы выиграли партизанскую войну против разлагающегося королевства, — парировал Твистер. — Но если мы хотим защитить нашу республику от настоящей угрозы извне, этого недостаточно. Нам нужна единая доктрина. Нам нужны военные училища для подготовки офицеров. Нам нужна железная дисциплина. Мы должны превратить эту неорганизованную толпу в Народно-Освободительную Армию Грифонии. И начать нужно прямо сейчас.\n\nФилипп обменялся взглядами с Терезой, которая молча кивнула в знак согласия.\n\n— Готовьте приказы о реорганизации, товарищ Твистер, — произнес Филипп. — Армия Прайвена должна родиться заново."
 GRW_rework.10.a:0 "Мы выкуем новую армию!"
 GRW_rework_fromliestothetruth:0 "От лжи к истине"
 GRW_rework_fromliestothetruth_desc:0 "Долгие столетия грифонов считали алчной и эгоистичной расой. Пришло время сломать эти стереотипы. Мы докажем всему миру, что способны на взаимовыручку, сострадание и единство."
 GRW_ray_of_truth_idea:0 "Луч истины"
 GRW_ray_of_truth_idea_desc:0 "Наш народ сбросил оковы стереотипов. Мы строим новое общество, основанное на взаимопомощи и братстве. Этот свет истины направляет нас вперед."
 GRW_ray_of_truth_idea_2:0 "Луч истины"
 GRW_ray_of_truth_idea_2_desc:0 "Наш народ сбросил оковы стереотипов. Мы строим новое общество, основанное на взаимопомощи и братстве. Этот свет истины направляет нас вперед."
 GRW_ray_of_truth_idea_3:0 "Луч истины"
 GRW_ray_of_truth_idea_3_desc:0 "Наш народ сбросил оковы стереотипов. Мы строим новое общество, основанное на взаимопомощи и братстве. Этот свет истины направляет нас вперед."
 GRW_ray_of_truth_idea_4:0 "Луч истины"
 GRW_ray_of_truth_idea_4_desc:0 "Наш народ сбросил оковы стереотипов. Мы строим новое общество, основанное на взаимопомощи и братстве. Этот свет истины направляет нас вперед."
 GRW_rework.11.t:0 "Чай и стереотипы"
 GRW_rework.11.d:0 "В небольшом, скромно обставленном кабинете витал аромат крепкого чая. За окном мерно шумел вечерний Прайвен, постепенно приходящий в себя после разрушительной войны. Филипп Редглад сделал долгий глоток из фарфоровой кружки и задумчиво посмотрел на сидящего напротив Рейна Твистера.\n\n— Знаешь, Рейн, что меня всегда раздражало больше всего? — нарушил тишину Филипп, ставя кружку на стол. — Не королевская армия. Не недостаток припасов. А то, как на нас смотрят другие. Считают нас меркантильными, жестокими, готовыми перегрызть друг другу глотки за лишний битс.\n\nОн устало потер переносицу.\n\n— Ты ведь тоже так думал, когда только приехал сюда, верно? Пони смотрят на грифонов как на алчных стервятников. И, к сожалению, старый режим делал всё, чтобы оправдать это клеймо.\n\nРейн, помешивая ложечкой свой чай, спокойно ответил:\n\n— Я приехал сюда бороться за свободу угнетенных, товарищ Филипп. Если бы я верил каждому стереотипу о грифонах, меня бы здесь не было. Я видел среди ваших людей больше искренности и готовности к самопожертвованию, чем в самых сытых городах Эквестрии.\n\nФилипп слегка улыбнулся. Это была искренняя улыбка старого солдата, который увидел проблеск надежды.\n\n— Именно поэтому мы должны измениться не только политически, но и духовно, — твердо сказал Редглад. — Революция — это не просто смена флагов и правительства. Это перековка самой сути нашего народа. Мы должны выкорчевать из сердец грифонов жадность и эгоизм. Мы построим общество, где каждый готов подставить плечо товарищу, где взаимовыручка станет основой нашего существования. Мы очистим наше имя от лжи прошлого и покажем континенту истинное лицо грифонов.\n\nРейн кивнул, поднимая кружку.\n\n— За новую истину, товарищ.\n\nОни молча чокнулись. Впереди предстояла огромная работа, но фундамент нового, братского общества уже был заложен."
 GRW_rework.11.a:0 "Истина восторжествует!"
 GRW_rework_bandits:0 "Отчет: «О бандитах»"
 GRW_rework_bandits_desc:0 "Западные рубежи нашей молодой республики постоянно подвергаются набегам. Бандиты из Блэкрока не признают никаких законов и грабят наши поселения. Мы не можем позволить им и дальше безнаказанно терроризировать наш народ."
 GRW_rework.12.t:0 "Проблема на западе"



 GRW_rework.12.d:0 "Дверь в кабинет Филиппа Редглада с тихим скрипом отворилась, и внутрь уверенным шагом вошел Рейн Твистер. В руках он держал пухлую папку с документами, перевязанную бечевкой.\n\n— Товарищ Филипп, — произнес Рейн, кладя папку на стол перед главнокомандующим. — Это последний отчет о ситуации на западной границе.\n\nФилипп тяжело вздохнул, развязал бечевку и пробежался взглядом по первым страницам. С каждой прочитанной строчкой его лицо мрачнело всё больше. Он отложил бумаги и в упор посмотрел на Рейна.\n\n— Бандиты Блэкрока, — процедил Филипп сквозь зубы. — Они были занозой в заднице еще до революции. Но теперь они перешли все границы. Набеги на приграничные поселки участились. Они крадут наше продовольствие, убивают наших граждан и уводят грифонов в рабство. Они считают, что наша молодая республика слаба и не сможет дать им отпор.\n\nРейн кивнул, его голос звучал ледяным спокойствием:\n\n— Наши ополченцы пытались организовать оборону, но бандиты наносят удары молниеносно и тут же скрываются на своих территориях. Они действуют как стая стервятников. Нам нужен более радикальный подход.\n\nФилипп поднялся из-за стола и подошел к карте Прайвена, висящей на стене. Он провел когтем по западной границе, где расположились земли Блэкрока.\n\n— Эти дикари не понимают языка дипломатии. Они уважают только силу, — жестко сказал Филипп. — Мы не можем строить новое справедливое общество, пока на наших границах бесчинствует эта гниль. С ними нужно покончить раз и навсегда.\n\nОн повернулся к Рейну, в его глазах горел огонь решимости.\n\n— Подготовьте армию, товарищ Твистер. Мы отправляемся на запад. Мы принесем закон и порядок в эти дикие земли, и пусть каждый бандит узнает гнев Народной Республики.\n\n— Будет сделано, товарищ Филипп, — отчеканил Рейн и покинул кабинет. Маховик войны начал раскручиваться."



 GRW_rework.12.a:0 "Стереть их в порошок!"



 GRW_rework_beginlikbez:0 "Начать ЛикБез"



 GRW_rework_beginlikbez_desc:0 "Обучение чтению и письму — первый шаг к осознанности. Программа Ликвидации Безграмотности охватит все слои общества, от фабричных рабочих до крестьян, чтобы каждый мог внести свой вклад в строительство нашей страны."



 GRW_rework_likbez_tt:0 "§CНачинает программу Ликвидации Безграмотности§!"



 GRW_rework_school:0 "Образование для сельской местности"



 GRW_rework_school_desc:0 "Огромная часть нашего населения живет в деревнях, где школы являются огромной редкостью. Мы должны направить учителей в самые отдаленные уголки нашей республики."



 GRW_rework_likbez2:0 "Базовые знания"



 GRW_rework_likbez2_desc:0 "Простого умения читать и писать недостаточно. Нашим рабочим нужны базовые знания в области арифметики и естественных наук, чтобы эффективно работать на новых заводах."



 GRW_rework_likbez2_tt:0 "§CПродолжает программу Ликвидации Безграмотности§!"



 GRW_rework_knowledge:0 "Разрыв цепей"



 GRW_rework_knowledge_desc:0 "Невежество было цепями, которыми старый режим сковывал разум нашего народа. Теперь эти цепи разорваны. Свет знаний озарил Прайвен, открывая нам путь к светлому будущему."



 GRW_literate_population_idea:0 "Грамотное население"



 GRW_literate_population_idea_desc:0 "Огромная кампания по ликвидации безграмотности увенчалась успехом. Теперь наши рабочие и крестьяне могут свободно читать, писать и получать новые знания, что значительно ускорит развитие республики."



 GRW_rework_knowledge_tt:0 "§CМы победили неграмотность§!"



 GRW_rework_indre1_tt:0 "§CНачинает план по восстановлению и строительству новой экономики§!"



 GRW_rework.13.t:0 "Второй съезд"



 GRW_rework.13.d:0 "В переполненном зале Второго съезда царила напряженная тишина, прерываемая лишь шелестом бумаг. Филипп Редглад, стоя за трибуной, обвел взглядом делегатов со всей республики.\n\n— Товарищи, — его голос разнесся под сводами зала, — мы выиграли войну за наше освобождение, но теперь перед нами стоит еще более сложная задача. Мы унаследовали страну, лежащую в руинах. Экономика парализована, заводы стоят, а поля разорены.\n\nОн сделал паузу, доставая из папки увесистый документ.\n\n— Однако мы не сдадимся перед лицом разрухи. Сегодня я представляю вам Новый Экономический План — комплексную стратегию по восстановлению нашей промышленности, форсированию производства и обеспечению каждого трудящегося работой и хлебом. Мы заставим фабрики снова дымить, мы восстановим железные дороги и превратим Прайвен в индустриальное сердце континента!\n\nЗал взорвался аплодисментами. Грифоны вскакивали со своих мест, приветствуя новую эру в истории республики. Впереди были годы упорного труда, но теперь у нас была ясная цель."



 GRW_rework.13.a:0 "§CНачинаем строительство нашего будущего§!"



 GRW_rework_recovering_economy:0 "Восстанавливающаяся экономика"



 GRW_rework_recovering_economy_desc:0 "Наш новый экономический план начал приносить свои плоды. Хотя до полного восстановления еще далеко, хаос отступает, заводы возвращаются к работе, а люди вновь обретают уверенность в завтрашнем дне."



 GRW_rework_recovering_economy_2:0 "Восстанавливающаяся экономика"



 GRW_rework_recovering_economy_2_desc:0 "Наш новый экономический план начал приносить свои плоды. Хотя до полного восстановления еще далеко, хаос отступает, заводы возвращаются к работе, а люди вновь обретают уверенность в завтрашнем дне. Особое внимание сейчас уделяется поддержанию работоспособности текущих производств, что позволяет нам бесплатно ремонтировать часть инфраструктуры."



 GRW_rework_indre3_tt:0 "§CПродолжает восстановление и строительство экономики§!"



 GRW_rework_recovering_economy_3:0 "Восстанавливающаяся экономика"



 GRW_rework_recovering_economy_3_desc:0 "Процесс восстановления экономики идет полным ходом. Новые заводы вступают в строй, а старые предприятия модернизируются. Дефицит промышленных мощностей становится все менее ощутимым, хотя мы все еще нуждаемся в дальнейших реформах для полного раскрытия нашего потенциала."



